{% extends "base.html" %}
{% block title %}Schedule a Meeting &mdash; {{ group.name }}{% endblock %}

{% block content %}
  <section class="form-page">
    <h1>Schedule a meeting</h1>
    <p class="form-intro">For {{ group.name }}.</p>
    <form method="post" class="stack-form">
      <div class="form-row">
        <label>
          Date
          <input type="date" name="date" required>
        </label>
        <label>
          Time
          <input type="time" name="time" required>
        </label>
      </div>
      <label>
        Location
        <input type="text" name="location" placeholder="{{ group.meeting_location or 'e.g. Library Room 204' }}">
      </label>
      <label>
        Notes <span class="optional">(optional)</span>
        <textarea name="notes" rows="3" placeholder="e.g. Discuss chapters 1-6"></textarea>
      </label>
      <button type="submit" class="btn-primary">Schedule meeting</button>
    </form>
  </section>
{% endblock %}
