{% extends "base.html" %}
{% block title %}Sign In &mdash; Campus Reads{% endblock %}

{% block content %}
  <section class="form-page">
    <h1>Sign in</h1>
    <form method="post" class="stack-form">
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <label>
        Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
    <p class="form-footnote">New here? <a href="{{ url_for('signup') }}">Create an account</a>.</p>
  </section>
{% endblock %}
